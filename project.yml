name: LangkahKu
options:
  bundleIdPrefix: com.langkahku
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LangkahKu:
    type: application
    platform: iOS
    sources:
      - path: LangkahKu
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: LangkahKu/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.langkahku.ios
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LangkahKuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LangkahKuTests
    dependencies:
      - target: LangkahKu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
